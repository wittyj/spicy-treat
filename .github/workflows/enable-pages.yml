name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from branch main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          VER="X-GitHub-Api-Version: 2022-11-28"
          BODY='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'

          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "$AUTH" -H "$ACCEPT" -H "$VER" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "$BODY")
          echo "POST /pages -> ${code}"
          cat /tmp/pages.json
          echo

          if [ "$code" = "409" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
              -X PUT \
              -H "$AUTH" -H "$ACCEPT" -H "$VER" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d "$BODY")
            echo "PUT /pages -> ${code}"
            cat /tmp/pages.json
            echo
          fi

          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "Could not enable GitHub Pages from main /"
            exit 1
          fi

          echo "--- site ---"
          curl -sS -H "$AUTH" -H "$ACCEPT" -H "$VER" \
            "https://api.github.com/repos/${REPO}/pages"
          echo
